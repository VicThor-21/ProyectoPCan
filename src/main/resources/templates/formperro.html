<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCan Formulario Perro</title>
</head>
<body>
<div style="
        border: 2px solid #333;
        padding: 20px;
        border-radius: 10px;
        width: fit-content;
        box-shadow: 0px 4px 8px rgba(0,0,0,0.1);">

    <h2>Formulario Perro</h2>

    <form name="formperro" th:action="@{/formperro}" th:object="${perro}" method="post">
        <input type="hidden" th:field="*{id}">

        <div>
            <label>Nombre: </label>
            <input type="text" th:field="*{nombre}">
        </div><br>
        <div>
            <label>Raza: </label>
            <input type="text" th:field="*{raza}">
        </div><br>
        <div>
            <label>Edad: </label>
            <input type="number" th:field="*{edad}">
        </div><br>
        <div>
            <fieldset>
                <legend>Sexo: </legend>
                <input type="radio" id="macho" th:field="*{sexo}" value="MACHO">
                <label for="macho">Macho</label>
                <input type="radio" id="hembra" th:field="*{sexo}" value="HEMBRA">
                <label for="hembra">Hembra</label>
            </fieldset>
        </div><br>
        <div>
            <label>Peso: </label>
            <input type="number" step="0.01" th:field="*{peso}">
        </div><br>
        <div>
            <label th:text="#{estado}"></label>
            <select th:field="*{estado}">
                <option value=""></option>
                <option th:each="est:${estados}" th:value="${est}" th:text="${est}"></option>
            </select>
        </div><br>
        <div>
            <label>Fecha Ingreso: </label>
            <input type="date" th:field="*{fechaIngreso}">
        </div><br>

        <button>💾 Guardar</button>

        <input type="reset" value="⚪️ Limpiar Formulario">
    </form>
</div>
<br>
<a th:href="@{/perros}">
    <input type="button" value="⬅️ Atrás">
</a>
</body>
</html>
